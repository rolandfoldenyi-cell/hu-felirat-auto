name: Android test APK
on:
  push:
    branches: [codex/android-caption-pipeline]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: JavaScript pipeline checks
        run: node --test tests/*.test.mjs
      - name: Build and check Android
        working-directory: android
        run: gradle --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Name APK and record checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/HU-Felirat-Codex-2.1.0-test2.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cp android/README.md dist/README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HU-Felirat-Auto-Android
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Android check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and verify the native message boundary
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            test_exit=0
            gradle --no-daemon --console=plain connectedDebugAndroidTest || test_exit=$?
            mkdir -p app/build/reports/androidTests
            adb logcat -d -s HUCaptionProbe:I HUCaptionExtractor:W > app/build/reports/androidTests/network-probe.txt
            exit "$test_exit"
      - name: Emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-emulator-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
