plugins { id 'com.android.application' }

android {
    namespace 'hu.feliratauto.android'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'hu.feliratauto.codexspeech'
        minSdk 26
        targetSdk 35
        versionCode 22002
        versionName '2.2.0-test2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('web-assets'); assets.srcDir rootProject.file('model-assets') } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    androidResources { noCompress += ['bin'] }
    buildTypes { release { minifyEnabled false } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}

tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../public'))
    from(rootProject.file('LICENSE')) { into 'licenses'; rename { 'GPL-3.0.txt' } }
    from(rootProject.file('licenses')) { into 'licenses' }
    into(layout.buildDirectory.dir('web-assets/site'))
    exclude 'icons/*.js', 'icons/*.html', 'icons/*.css', 'icons/manifest.json'
}
tasks.register('checkSpeechModels') {
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(rootProject.file('model-manifest.json'))
        manifest.models.each { model ->
            def asset = rootProject.file('model-assets/models/' + model.file)
            if (!asset.isFile() || asset.length() != (model.bytes as long)) throw new GradleException('Run python3 android/prepare-asr-assets.py before building: missing ' + model.file)
        }
    }
}
tasks.named('preBuild').configure { dependsOn('syncWebAssets', 'checkSpeechModels') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.27.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
